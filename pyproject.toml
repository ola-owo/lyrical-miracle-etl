[project]
name = "data-loader"
version = "1.0.0"
requires-python = ">=3.14"
dependencies = [
    "adbc-driver-bigquery>=1.11.0",
    "adbc-driver-postgresql>=1.11.0",
    "asyncpg>=0.31.0",
    "connectorx>=0.4.5",
    "dagster>=1.13.26",
    "dagster-postgres>=0.29.26",
    "dagster-webserver>=1.13.26",
    "dlt[bigquery,duckdb,postgres,sql-database]>=1.27.0",
    "fsspec>=2026.4.0",
    "google-cloud-aiplatform>=1.157.0",
    "google-cloud-bigquery>=3.42.0",
    "google-cloud-bigquery-storage>=2.41.0",
    "google-genai>=2.4.0",
    "lyricsgenius>=3.14.0",
    "numpy>=2.4.6",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "rapidfuzz>=3.14.5",
    "scikit-learn>=1.9.1",
    "scipy>=1.17.1",
    "sqlalchemy-bigquery>=1.17.2",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "marimo[mcp]>=0.23.9",
    "pytest>=9.1.1",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "data_loader"
module-root = ""

[tool.ruff.format]
quote-style = "single"

[tool.pytest.ini_options]
testpaths = ["tests"]
