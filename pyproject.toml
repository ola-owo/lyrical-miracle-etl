[project]
name = "data-loader"
version = "0.4.0"
requires-python = ">=3.14"
dependencies = [
    "adbc-driver-bigquery>=1.11.0",
    "adbc-driver-postgresql>=1.11.0",
    "apache-airflow[graphviz]>=3.3.0",
    "asyncpg>=0.31.0",
    "connectorx>=0.4.5",
    "dlt[bigquery,duckdb,postgres,sql-database]>=1.27.0",
    "fsspec>=2026.4.0",
    "google-cloud-aiplatform>=1.157.0",
    "google-cloud-bigquery>=3.42.0",
    "google-cloud-bigquery-storage>=2.41.0",
    "google-genai>=2.4.0",
    "lyricsgenius>=3.12.1",
    "numpy>=2.4.6",
    "polars>=1.40.1",
    "pyarrow>=24.0.0",
    "rapidfuzz>=3.14.5",
    "scipy>=1.17.1",
    "sqlalchemy-bigquery>=1.17.2",
    "tqdm>=4.67.3",
]

[dependency-groups]
dev = [
    "basedpyright>=1.39.10",
    "marimo>=0.23.9",
]

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "data_loader"
module-root = ""

[tool.ruff.format]
quote-style = "single"
